name: Diagnóstico ERDDAP (rama temporal)
on:
  push:
    branches: [diag-erddap]
    paths: ["diag/**", ".github/workflows/diag.yml"]
permissions:
  contents: write
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 diag/probe_cmems.py
      - if: always()
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag/out
          git diff --cached --quiet && exit 0
          git commit -m "diag [skip ci]" && git push origin HEAD:diag-erddap
