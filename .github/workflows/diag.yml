name: Diagnóstico ERDDAP (rama temporal)
on:
  push:
    branches: [diag-erddap]
    paths: ["diag/**", ".github/workflows/diag.yml"]
permissions:
  contents: write
concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r validate/requirements.txt
          python3 -m unittest discover validate 2>&1 | tail -3 > diag/out/tests.txt
          python3 diag/test_cmems.py > diag/out/run.txt 2>&1 || true
          cp validation/build.log validation/report.md diag/out/ 2>/dev/null || true
      - if: always()
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag/out
          git diff --cached --quiet && exit 0
          git commit -m "diag [skip ci]" && git push origin HEAD:diag-erddap
