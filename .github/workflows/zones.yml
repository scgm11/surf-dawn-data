name: Picos por zonas
# Arma spots/ (docs/formatos.md) desde seeds/: ajusta cada pico a la costa de OpenStreetMap,
# calcula su orientación y su punto de olas (Open-Meteo), y publica los índices y celdas.
on:
  push:
    branches: [main, zonas-mundo]
    paths:
      - "seeds/**"
      - "tools/build_zones.py"
      - "tools/check_seeds.py"
      - "tools/lib/**"
      - "models.csv"
      - "tide/regions.json"
      - ".github/workflows/zones.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install global-land-mask==1.0.0
      - name: Cachés de OSM y Open-Meteo (la costa y las celdas de tierra no cambian)
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/.osm_cache
            tools/.cache
          key: zones-${{ github.run_id }}
          restore-keys: zones-
      - name: Semillas
        run: python3 tools/check_seeds.py --present
      - name: Zonas
        run: |
          set -o pipefail
          python3 tools/build_zones.py --strict 2>&1 | tee spots/build.log
      - name: "Guardar cachés (también si el build se corta: la próxima corrida sigue desde ahí)"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tools/.osm_cache
            tools/.cache
          key: zones-${{ github.run_id }}
      - name: "Publicar (también con errores: las regiones buenas, el reporte y el log)"
        if: always()
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add spots
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Picos: zonas $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
