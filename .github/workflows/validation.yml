name: Validación de modelos de olas y viento
# Compara los modelos de olas y de viento de Open-Meteo con boyas y estaciones costeras (NDBC, CDIP,
# AODN, Marine Institute) de los últimos 30 días y publica validation/ (docs/formatos.md, sección Validación).
on:
  push:
    branches: [validacion-mundo]
    paths:
      - "validate/**"
      - ".github/workflows/validation.yml"
  schedule:
    - cron: "17 6 3 * *"          # el día 3 de cada mes, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r validate/requirements.txt
      - name: Pruebas
        run: python3 -m unittest discover validate
      - name: Caché de descargas (boyas y Open-Meteo del día)
        uses: actions/cache/restore@v4
        with:
          path: validate/.cache
          key: validation-${{ github.run_id }}
          restore-keys: validation-
      - name: Validar
        shell: bash
        run: |
          set -o pipefail
          mkdir -p validation
          python3 validate/run.py 2>&1 | tee validation/build.log
      - name: Guardar caché
        if: always()
        uses: actions/cache/save@v4
        with:
          path: validate/.cache
          key: validation-${{ github.run_id }}
      - name: Publicar
        if: always()
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add validation
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Validación: modelos de olas y viento contra boyas $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
