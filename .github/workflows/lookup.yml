name: Búsqueda por nombre
# Lo que tienen Wikidata, Wikipedia, GeoNames y OpenStreetMap con el nombre de cada pico, alrededor de
# su posición (tools/lookup.py, issue #7 §5.8): para revisar a mano los emblemáticos sin fuente o lejos
# de la suya. Publica validation/lookup.md; no cambia ninguna semilla.
on:
  push:                         # al cambiar la herramienta: todos los emblemáticos sin fuente o lejos
    branches: [main, zonas-mundo]
    paths:
      - "tools/lookup.py"
      - ".github/workflows/lookup.yml"
  workflow_dispatch:
    inputs:
      names:
        description: "Picos REGIÓN/NOMBRE separados por ';' (vacío: los emblemáticos sin fuente o lejos)"
        required: false
        default: ""
      km:
        description: "Radio de búsqueda en km"
        required: false
        default: "15"
      overpass:
        description: "Buscar también con Overpass (lento)"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar
        shell: bash
        env:
          NAMES: ${{ github.event.inputs.names }}
          KM: ${{ github.event.inputs.km }}
          OVERPASS: ${{ github.event.inputs.overpass }}
        run: |
          set -o pipefail
          args=(--km "${KM:-15}")
          [ "$OVERPASS" = "true" ] && args+=(--overpass)
          [ -n "$NAMES" ] && IFS=';' read -ra N <<< "$NAMES" && args+=("${N[@]}")
          python3 tools/lookup.py "${args[@]}" 2>&1 | tee validation/lookup.log
      - name: Publicar
        if: always()
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add validation/lookup.md validation/lookup.log
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Búsqueda por nombre $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
