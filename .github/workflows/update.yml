name: Actualizar tablas de marea (SOHMA)
on:
  schedule:
    - cron: "17 9 1,15 * *"      # los días 1 y 15 de cada mes, 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Año en curso
        run: python3 tools/sohma_tide.py --year "$(date +%Y)"
      - name: Año siguiente (si el SOHMA ya lo publicó)
        run: python3 tools/sohma_tide.py --year "$(( $(date +%Y) + 1 ))" || echo "todavía no está"
      - name: Brasil, Imbituba (DHN vía Epagri/CIRAM; el PDF anual se renueva solo)
        run: python3 tools/ciram_tide.py --port imbituba
      - name: Publicar cambios
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tide
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Tablas de marea SOHMA: $(date -u +%Y-%m-%d)"
          git push
