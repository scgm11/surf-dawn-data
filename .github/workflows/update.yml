name: Actualizar tablas de marea (SOHMA)
on:
  schedule:
    - cron: "17 9 1,15 3-11 *"   # los días 1 y 15 de cada mes, 09:17 UTC
    - cron: "17 9 * 12,1,2 *"    # y a diario de diciembre a febrero: el SOHMA saca la tabla nueva entre principios de diciembre y el 20 de enero
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # La salida 2 de sohma_tide.py es que el SOHMA todavía no publicó esa tabla: en enero pasa con la del
      # año en curso, y mientras tanto valen los meses "ext" (tools/tide/extend_official.py). Cualquier otra
      # falla la corrida, pero Imbituba y lo que ya se escribió siguen adelante.
      - name: Año en curso
        run: |
          rc=0
          python3 tools/sohma_tide.py --year "$(date +%Y)" || rc=$?
          [ "$rc" = 2 ] && echo "::warning::el SOHMA todavía no publicó la tabla de $(date +%Y)" && exit 0
          exit "$rc"
      - name: Año siguiente (si el SOHMA ya lo publicó)
        if: always()
        run: |
          rc=0
          python3 tools/sohma_tide.py --year "$(( $(date +%Y) + 1 ))" || rc=$?
          [ "$rc" = 2 ] && echo "todavía no está" && exit 0
          exit "$rc"
      - name: Brasil, Imbituba (DHN vía Epagri/CIRAM; el PDF anual se renueva solo)
        if: always()
        run: python3 tools/ciram_tide.py --port imbituba
      - name: Tramos para el campo Marea
        if: always()
        run: python3 tools/tide/chunks.py
      - name: Publicar cambios
        if: always()
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tide
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Tablas de marea SOHMA: $(date -u +%Y-%m-%d)"
          git push
