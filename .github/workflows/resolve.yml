name: Semillas fuera de la costa
# Busca por nombre en OpenStreetMap las semillas que build_zones.py no puede ubicar (a más de
# 2,5 km de la costa) y las mueve al lugar con ese nombre que está sobre la costa
# (tools/resolve_seeds.py). Deja seeds/resolve.log con cada cambio y lo que quedó sin resolver.
# Se corre a mano (puede tardar horas con Overpass ocupado); si mueve semillas, pide el build de las zonas.
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Regiones (vacío: todas)"
        required: false
        default: ""
      names:
        description: "Picos REGIÓN/NOMBRE separados por ';' que se buscan aunque estén sobre la costa (sólo esos)"
        required: false
        default: ""
      no_overpass:
        description: "Sólo Nominatim (más rápido)"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: write                 # para pedir el build de las zonas
concurrency:
  group: data-commit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy global-land-mask==1.0.0
      - name: Cachés de OSM y Open-Meteo
        uses: actions/cache/restore@v4
        with:
          path: |
            tools/.osm_cache
            tools/.cache
          key: zones-${{ github.run_id }}
          restore-keys: zones-
      - name: Resolver
        shell: bash
        env:
          REGIONS: ${{ github.event.inputs.regions }}
          NAMES: ${{ github.event.inputs.names }}
          NO_OVERPASS: ${{ github.event.inputs.no_overpass }}
        run: |
          set -o pipefail
          args=()
          [ -n "$REGIONS" ] && read -ra R <<< "$REGIONS" && args+=(--regions "${R[@]}")
          [ -n "$NAMES" ] && IFS=';' read -ra N <<< "$NAMES" && args+=(--names "${N[@]}")
          [ "$NO_OVERPASS" = "true" ] && args+=(--no-overpass)
          python3 tools/resolve_seeds.py "${args[@]}" 2>&1 | tee /tmp/resolve.out
          python3 tools/check_seeds.py --present
      - name: Guardar cachés
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            tools/.osm_cache
            tools/.cache
          key: zones-${{ github.run_id }}
      - name: Publicar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "surf-dawn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seeds
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Semillas: posiciones de OSM para las que estaban fuera de la costa"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          if git diff --name-only HEAD~1 HEAD | grep -q "^seeds/spots/"; then
            gh workflow run zones.yml --ref "${GITHUB_REF_NAME}" || echo "no se pudo pedir zones.yml"
          fi
